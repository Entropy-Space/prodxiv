services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: prodxiv
      POSTGRES_PASSWORD: prodxiv
      POSTGRES_USER: prodxiv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prodxiv -d prodxiv"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Containerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://prodxiv:prodxiv@postgres:5432/prodxiv
      DIRECT_DATABASE_URL: postgres://prodxiv:prodxiv@postgres:5432/prodxiv
      PRODXIV_BIND_ADDRESS: 0.0.0.0:3000
      PRODXIV_BOT_ACTOR: ${PRODXIV_BOT_ACTOR:-paperbot:daily}
      PRODXIV_BOT_TOKEN: ${PRODXIV_BOT_TOKEN:-}
      PRODXIV_GITHUB_OIDC_ENVIRONMENT: ${PRODXIV_GITHUB_OIDC_ENVIRONMENT:-}
      PRODXIV_GITHUB_OIDC_REPOSITORY: ${PRODXIV_GITHUB_OIDC_REPOSITORY:-}
      PRODXIV_GITHUB_OIDC_REPOSITORY_ID: ${PRODXIV_GITHUB_OIDC_REPOSITORY_ID:-}
      PRODXIV_PUBLISH_ACTOR: ${PRODXIV_PUBLISH_ACTOR:-local_publisher}
      PRODXIV_PUBLISH_TOKEN: ${PRODXIV_PUBLISH_TOKEN:?set PRODXIV_PUBLISH_TOKEN}
      PRODXIV_TRENDING_INGEST_ACTOR: ${PRODXIV_TRENDING_INGEST_ACTOR:-github_actions:daily_trending}
      PRODXIV_TRENDING_INGEST_TOKEN: ${PRODXIV_TRENDING_INGEST_TOKEN:-}
    ports:
      - "127.0.0.1:3000:3000"

  web:
    build:
      context: .
      dockerfile: Containerfile
      target: web
    ports:
      - "127.0.0.1:4321:80"

volumes:
  postgres_data:
