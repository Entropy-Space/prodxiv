name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: domain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: prodxiv
          POSTGRES_PASSWORD: prodxiv
          POSTGRES_USER: prodxiv
        options: >-
          --health-cmd "pg_isready -U prodxiv -d prodxiv"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://prodxiv:prodxiv@127.0.0.1:5432/prodxiv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint domain
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test domain
        run: cargo test --workspace

      - name: Check generated OpenAPI contract
        run: |
          cargo run -p prodxiv-api --bin generate-openapi -- openapi/prodxiv-api.json
          git diff --exit-code -- openapi/prodxiv-api.json

      - name: Test Vercel API build selection
        run: sh scripts/test-vercel-api-ignore-build.sh

  paperbot:
    name: paperbot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun ci

      - name: Check generated TypeScript contracts
        run: |
          bun run contracts
          git diff --exit-code -- packages/contracts/src/generated

      - name: Check Paperbot
        run: bun run check:paperbot

      - name: Test Paperbot
        run: bun run test:paperbot

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun ci

      - name: Check website
        run: bun run check

      - name: Build website
        run: bun run build:web
