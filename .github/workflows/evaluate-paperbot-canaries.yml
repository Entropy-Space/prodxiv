name: Paperbot Fixed Canaries

on:
  pull_request:
    types:
      - labeled
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      ref:
        description: Trusted branch or commit to evaluate.
        required: false
        default: main
        type: string
      model:
        description: DeepSeek model used for the canaries.
        required: false
        default: deepseek-v4-flash
        type: string

permissions:
  contents: read

concurrency:
  group: paperbot-fixed-canaries
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'paperbot-canaries') &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'paperbot-canaries'
        )
      )
    name: evaluate three fixed repositories
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PAPERBOT_MODEL: ${{ inputs.model || 'deepseek-v4-flash' }}

    steps:
      - name: Check out trusted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun ci

      - name: Validate model configuration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::Add the DEEPSEEK_API_KEY repository secret for Paperbot canaries."
            exit 1
          fi

      - name: Generate fixed private drafts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          bun run paperbot agent batch \
            examples/paperbot-evaluation/canaries.json \
            --output evaluation/runs \
            --allow-remote-model \
            --mode auto \
            --model "${PAPERBOT_MODEL}" \
            --concurrency 2 \
            --format json > evaluation-batch-result.json

      - name: Record canary metadata
        if: always()
        run: |
          mkdir -p evaluation
          cp examples/paperbot-evaluation/canaries.json evaluation/manifest.json
          cp evaluation-batch-result.json evaluation/batch-result.json 2>/dev/null || true
          printf '{"workflow_run_id":"%s","repository_revision":"%s","model":"%s"}\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "${PAPERBOT_MODEL}" \
            > evaluation/workflow.json

      - name: Upload private canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperbot-canaries-${{ github.run_id }}
          path: evaluation
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Publish canary summary
        if: always()
        run: |
          {
            echo "## Paperbot fixed canaries"
            echo
            echo "Model: \`${PAPERBOT_MODEL}\`"
            echo "Repository revision: \`${GITHUB_SHA}\`"
            if [ -f evaluation/runs/batch.json ]; then
              echo
              echo '```json'
              jq '.summary' evaluation/runs/batch.json
              echo '```'
              if jq -e '.summary.failed > 0' evaluation/runs/batch.json >/dev/null; then
                echo
                echo "### Failed projects"
                jq -r '.projects[] | select(.state == "failed") | "- `\(.repository_url)`: \(.error.message // "unknown failure")"' \
                  evaluation/runs/batch.json
              fi
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
