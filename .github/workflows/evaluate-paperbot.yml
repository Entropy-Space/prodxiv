name: Daily Paperbot Drafts

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: DeepSeek model used for daily drafting.
        required: false
        default: deepseek-v4-flash
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: evaluate-paperbot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: publish eligible drafts and generate pending drafts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      PAPERBOT_MODEL: ${{ inputs.model || 'deepseek-v4-flash' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun ci

      - name: Validate daily workflow configuration
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PRODXIV_API_URL: ${{ vars.PRODXIV_API_URL }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "::error::Add the DEEPSEEK_API_KEY production secret for daily Paperbot drafting."
            exit 1
          fi
          if [ -z "${PRODXIV_API_URL}" ]; then
            echo "::error::Add the PRODXIV_API_URL production variable."
            exit 1
          fi

      - name: Publish approved and bot-owned pending drafts
        id: promote
        continue-on-error: true
        env:
          PRODXIV_API_URL: ${{ vars.PRODXIV_API_URL }}
        run: |
          mkdir -p evaluation
          bun run scripts/paperbot-evaluation/sync-drafts.ts promote \
            > evaluation/promotion.json

      - name: Select discovery repositories
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PRODXIV_API_URL: ${{ vars.PRODXIV_API_URL }}
        run: |
          bun run paperbot agent select-trending \
            --output evaluation/trend-selection \
            --allow-remote-model \
            --model "${PAPERBOT_MODEL}" \
            --format json > evaluation-selection.json

      - name: Prepare three rotating drafts
        env:
          PRODXIV_API_URL: ${{ vars.PRODXIV_API_URL }}
        run: |
          bun run scripts/paperbot-evaluation/prepare-manifest.ts \
            evaluation-selection.json \
            evaluation-manifest.json

      - name: Generate private evaluation drafts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          bun run paperbot agent batch evaluation-manifest.json \
            --output evaluation/runs \
            --allow-remote-model \
            --mode auto \
            --model "${PAPERBOT_MODEL}" \
            --concurrency 2 \
            --format json > evaluation-batch-result.json

      - name: Submit generated papers as private drafts
        env:
          PRODXIV_API_URL: ${{ vars.PRODXIV_API_URL }}
        run: |
          bun run scripts/paperbot-evaluation/sync-drafts.ts submit \
            evaluation/runs/batch.json 3 \
            > evaluation/submission.json

      - name: Record evaluation metadata
        if: always()
        run: |
          mkdir -p evaluation
          cp evaluation-manifest.json evaluation/manifest.json 2>/dev/null || true
          cp evaluation-batch-result.json evaluation/batch-result.json 2>/dev/null || true
          printf '{"workflow_run_id":"%s","repository_revision":"%s","model":"%s"}\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "${PAPERBOT_MODEL}" \
            > evaluation/workflow.json

      - name: Upload private evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperbot-evaluation-${{ github.run_id }}
          path: evaluation
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Publish evaluation summary
        if: always()
        run: |
          {
            echo "## Daily Paperbot drafts"
            echo
            echo "Model: \`${PAPERBOT_MODEL}\`"
            echo "Repository revision: \`${GITHUB_SHA}\`"
            if [ -f evaluation/runs/batch.json ]; then
              echo
              echo '```json'
              jq '.summary' evaluation/runs/batch.json
              echo '```'
            fi
            for report in evaluation/promotion.json evaluation/submission.json; do
              if [ -f "${report}" ]; then
                echo
                echo "### $(basename "${report}" .json)"
                echo
                echo '```json'
                jq '.' "${report}"
                echo '```'
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail after preserving a promotion error
        if: always() && steps.promote.outcome == 'failure'
        run: |
          echo "::error::One or more eligible drafts could not be published; see the promotion report."
          exit 1
