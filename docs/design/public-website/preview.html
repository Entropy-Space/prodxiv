  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;prodxiv-public-wireframes&quot;);

  const find = (selector) =&gt; {
    const element = root.querySelector(selector);
    if (!element) throw new Error(&quot;Missing preview element: &quot; + selector);

  const papers = [
    {
      key: &quot;archive-prodxiv&quot;, stage: &quot;published&quot;, product_name: &quot;prodxiv&quot;,
      title: &quot;Product knowledge, with a history.&quot;,
      summary: &quot;A versioned archive for the decisions, mechanisms, and lessons behind products.&quot;,
      topic: &quot;Knowledge systems&quot;, author: &quot;Entropy-Space&quot;, date: &quot;27 Aug 2026&quot;,
      paper_id: &quot;2608.000001&quot;, revision: 2, revisions: [2, 1], owner_kind: &quot;author&quot;,
      background: &quot;Product knowledge is spread across repositories, documentation, launch posts, and individual memory. A durable paper brings the reasoning and its limitations into one readable record.&quot;,
      architecture: &quot;Markdown is the authoring source. The publishing API validates each submission and creates an immutable revision. The website reads that exact revision, preserving its source and identifiers.&quot;,
      limitations: &quot;Structural validation does not prove that a claim is true. Readers still need inspectable evidence, explicit uncertainty, and a clear distinction between author attribution and agent-written prose.&quot;
    },
    {
      key: &quot;archive-paperbot&quot;, stage: &quot;published&quot;, product_name: &quot;Paperbot&quot;,
      title: &quot;Repository evidence before fluent prose.&quot;,
      summary: &quot;A local-first drafting workflow that separates repository observations from author intention.&quot;,
      topic: &quot;Developer tools&quot;, author: &quot;Entropy-Space&quot;, date: &quot;24 Aug 2026&quot;,
      paper_id: &quot;2608.000002&quot;, revision: 1, revisions: [1], owner_kind: &quot;bot&quot;,
      background: &quot;A repository can describe implementation well while leaving motivation, rejected alternatives, and lessons unexplained. A first draft should preserve that distinction.&quot;,
      architecture: &quot;Paperbot selects a bounded source bundle and builds an evidence ledger before drafting. Deterministic validation checks the resulting paper; a separate host performs authorized publication.&quot;,
      limitations: &quot;Source evidence can establish implementation details without establishing intention. Unmeasured performance claims and missing author context remain limitations, not facts.&quot;
    },
    {
      key: &quot;draft-recovery&quot;, stage: &quot;draft&quot;, product_name: &quot;Paperbot&quot;,
      title: &quot;Making automatic publication recoverable.&quot;,
      summary: &quot;Keeping successful drafts moving while failed projects remain inspectable and retryable.&quot;,
      topic: &quot;Developer tools&quot;, author: &quot;Entropy-Space&quot;, date: &quot;28 Aug 2026, 08:20 UTC&quot;,
      paper_uuid: &quot;8a24e5cc-8460-4eae-9bdf-94023f99d012&quot;, revision: 3, owner_kind: &quot;bot&quot;,
      background: &quot;A daily batch can have a mixture of successful and failed repositories. A single failure should remain visible without obscuring the drafts that were produced successfully.&quot;,
      architecture: &quot;The host records project outcomes separately, retains debugging artifacts privately, and submits successful papers for review. Publication is a distinct operation on one exact draft revision.&quot;,
      limitations: &quot;This is an unreviewed working account. Recovery depends on the failure category, validation result, and whether the saved revision remains unchanged. It does not promise that every draft will be published.&quot;
    },
    {
      key: &quot;draft-sources&quot;, stage: &quot;draft&quot;, product_name: &quot;Paperbot&quot;,
      title: &quot;Source boundaries for repository research.&quot;,
      summary: &quot;A closer look at which repository files enter analysis, and which must stay outside it.&quot;,
      topic: &quot;Developer tools&quot;, author: &quot;Entropy-Space&quot;, date: &quot;28 Aug 2026, 07:45 UTC&quot;,
      paper_uuid: &quot;17d7d938-3f94-42b2-8db1-d4bfa0a98271&quot;, revision: 1, owner_kind: &quot;bot&quot;,
      background: &quot;Repository research needs enough implementation context to be useful, without treating every file as an appropriate input. Selection and exclusion are part of the evidence boundary.&quot;,
      architecture: &quot;The scanner applies explicit exclusions and bounded selection. Public repository reads are pinned to a source revision. Run artifacts preserve provenance separately from the public paper.&quot;,
      limitations: &quot;A bounded selection can miss important context. Excluding sensitive paths is a safety measure, not proof that every included document is suitable for public release.&quot;
    },
    {
      key: &quot;draft-intention&quot;, stage: &quot;draft&quot;, product_name: &quot;prodxiv&quot;,
      title: &quot;What the code cannot tell the reader.&quot;,
      summary: &quot;An author-managed draft about making missing intention visible in a product paper.&quot;,
      topic: &quot;Knowledge systems&quot;, author: &quot;Entropy-Space&quot;, date: &quot;27 Aug 2026, 16:10 UTC&quot;,
      paper_uuid: &quot;cba50f57-2c76-4c82-a8a0-07812a7bef5d&quot;, revision: 2, owner_kind: &quot;author&quot;,
      background: &quot;Implementation records the result of a decision, but often not the alternatives or constraints that shaped it. Those missing explanations matter to a reader trying to learn from the work.&quot;,
      architecture: &quot;Repository observations and author statements remain distinct inputs. A human edit creates a new draft revision and moves the draft out of automatic bot approval.&quot;,
      limitations: &quot;This draft still needs author review. Attribution, a public preview, or a recent edit does not by itself establish that its account of intention has been endorsed.&quot;
    }
  ];
  const state = { page: &quot;papers&quot;, selected_key: undefined, selected_revision: undefined, query: &quot;&quot;, topic: &quot;&quot; };
  const template = find(&quot;#px-entry-template&quot;);
  const pages = Array.from(root.querySelectorAll(&quot;[data-page]&quot;));
  const navigation = Array.from(root.querySelectorAll(&quot;.px-navigation [data-route]&quot;));
  const dialog = find(&quot;#px-source-dialog&quot;);
  const search = find(&quot;#px-paper-search&quot;);
  const topic = find(&quot;#px-paper-topic&quot;);
  const revisionSelect = find(&quot;#px-revision-select&quot;);
  const contents = find(&quot;.px-contents&quot;);
  const provenance = find(&quot;.px-provenance&quot;);
  let compactReader;

      contents.open = !compact;
      provenance.open = !compact;
    }

  layoutObserver.observe(root);

  function renderList(target, records) {
    target.replaceChildren();
    records.forEach((paper) =&gt; {
      const item = template.content.cloneNode(true);
      item.querySelector(&quot;.px-entry&quot;).dataset.stage = paper.stage;
      item.querySelector(&quot;.px-entry-id&quot;).textContent = paper.stage === &quot;published&quot;
        ? paper.paper_id + &quot; · v&quot; + paper.revision

      item.querySelector(&quot;.px-entry-state&quot;).textContent = paper.stage === &quot;published&quot; ? &quot;Published&quot; : &quot;Pending review&quot;;
      const link = item.querySelector(&quot;[data-open-paper]&quot;);
      link.dataset.openPaper = paper.key;
      link.textContent = paper.title;
      item.querySelector(&quot;.px-entry-summary&quot;).textContent = paper.summary;
      item.querySelector(&quot;.px-entry-byline&quot;).textContent = paper.author + &quot; · Written by Paperbot&quot; + (paper.stage === &quot;draft&quot; ? &quot; · &quot; + (paper.owner_kind === &quot;bot&quot; ? &quot;Bot-owned&quot; : &quot;Author-managed&quot;) : &quot;&quot;);
      item.querySelector(&quot;.px-entry-topic&quot;).textContent = paper.topic;
      item.querySelector(&quot;.px-entry-date&quot;).textContent = (paper.stage === &quot;draft&quot; ? &quot;Edited &quot; : &quot;&quot;) + paper.date;
      target.appendChild(item);
    });
  }

  function filterPapers() {
    const filtered = papers.filter((paper) =&gt; paper.stage === &quot;published&quot;
      &amp;&amp; (!state.topic || paper.topic === state.topic)
      &amp;&amp; [paper.title, paper.product_name, paper.summary, paper.author].join(&quot; &quot;).toLowerCase().includes(state.query.toLowerCase().trim()));
    renderList(find(&quot;#px-papers-list&quot;), filtered);
    find(&quot;#px-results&quot;).textContent = filtered.length + (filtered.length === 1 ? &quot; paper&quot; : &quot; papers&quot;) + &quot; · Newest first&quot;;
    find(&quot;#px-no-results&quot;).hidden = filtered.length &gt; 0;
  }

  function showPage(page) {
    state.page = page;
    pages.forEach((element) =&gt; { element.hidden = element.dataset.page !== page; });
    const selected = papers.find((paper) =&gt; paper.key === state.selected_key);
    const activeRoute = page === &quot;reader&quot; ? (selected &amp;&amp; selected.stage === &quot;draft&quot; ? &quot;drafts&quot; : &quot;papers&quot;) : page;
    navigation.forEach((element) =&gt; {
      if (element.dataset.route === activeRoute) element.setAttribute(&quot;aria-current&quot;, &quot;page&quot;);
      else element.removeAttribute(&quot;aria-current&quot;);
    });
    find(&quot;#px-screen-announcement&quot;).textContent = page === &quot;reader&quot; &amp;&amp; selected ? selected.title : (page === &quot;drafts&quot; ? &quot;Pending drafts&quot; : page === &quot;papers&quot; ? &quot;Published papers&quot; : &quot;About prodxiv&quot;);
  }

  function selectedPaper() {
    return papers.find((paper) =&gt; paper.key === state.selected_key);
  }

  function paperDate(paper) {
    return paper.key === &quot;archive-prodxiv&quot; &amp;&amp; state.selected_revision === 1 ? &quot;20 Aug 2026&quot; : paper.date;
  }

  function summaryText(paper) {
    return paper.key === &quot;archive-prodxiv&quot; &amp;&amp; state.selected_revision === 1
      ? &quot;A Markdown-first archive for product decisions and lessons, preserved as immutable paper revisions.&quot;
      : paper.summary;
  }

  function paperPath(paper) {
    return paper.stage === &quot;published&quot;
      ? &quot;/papers/&quot; + paper.paper_id + &quot;/v&quot; + state.selected_revision
      : &quot;/drafts/&quot; + paper.paper_uuid;
  }

  function renderReader() {
    const paper = selectedPaper();
    if (!paper) return;
    const isDraft = paper.stage === &quot;draft&quot;;
    find(&quot;#px-reader-back&quot;).textContent = isDraft ? &quot;← Pending drafts&quot; : &quot;← Published papers&quot;;
    find(&quot;#px-reader-draft-notice&quot;).hidden = !isDraft;
    find(&quot;#px-reader-kind&quot;).textContent = paper.product_name + &quot; / &quot; + (isDraft ? &quot;Working paper&quot; : &quot;Product paper&quot;);
    find(&quot;#px-reader-title&quot;).textContent = paper.title;
    find(&quot;#px-reader-author&quot;).textContent = paper.author;
    find(&quot;#px-reader-identifier&quot;).textContent = isDraft
      ? &quot;Draft &quot; + paper.paper_uuid + &quot; · Revision &quot; + paper.revision
      : &quot;prodxiv:&quot; + paper.paper_id + &quot; · v&quot; + state.selected_revision;
    find(&quot;#px-reader-date&quot;).textContent = (isDraft ? &quot;Edited &quot; : &quot;Published &quot;) + paperDate(paper);
    find(&quot;#px-reader-summary&quot;).textContent = summaryText(paper);
    [&quot;background&quot;, &quot;architecture&quot;, &quot;limitations&quot;].forEach((section) =&gt; {
      find(&quot;#px-reader-&quot; + section).textContent = paper[section];
    });
    find(&quot;#px-citation-button&quot;).hidden = isDraft;
    find(&quot;#px-source-button&quot;).hidden = isDraft;
    find(&quot;#px-draft-link-button&quot;).hidden = !isDraft;
    find(&quot;#px-revision-control&quot;).hidden = isDraft || paper.revisions.length &lt; 2;
    revisionSelect.replaceChildren();
    if (!isDraft) {
      for (const revision of paper.revisions) {
        const option = document.createElement(&quot;option&quot;);
        option.value = String(revision);
        option.textContent = &quot;v&quot; + revision + (revision === paper.revision ? &quot; · Latest&quot; : &quot; · Earlier&quot;);
        revisionSelect.appendChild(option);
      }
      revisionSelect.value = String(state.selected_revision);
    }
    find(&quot;#px-reader-revision-note&quot;).textContent = isDraft
      ? (paper.owner_kind === &quot;bot&quot; ? &quot;Bot-owned. This unchanged revision may be published on the next run.&quot; : &quot;Author-managed. This draft will not be automatically approved.&quot;) + &quot; Draft content is not an immutable publication.&quot;
      : &quot;This exact published revision is immutable.&quot; + (state.selected_revision &lt; paper.revision ? &quot; A newer revision is available above.&quot; : &quot;&quot;);
    showPage(&quot;reader&quot;);

    find(&quot;#px-dialog-title&quot;).textContent = title;
    find(&quot;#px-dialog-caption&quot;).textContent = caption;
    find(&quot;#px-dialog-content&quot;).value = content;

  root.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (!(event.target instanceof Element)) return;
    const sectionLink = event.target.closest(&quot;.px-contents a&quot;);
    if (sectionLink) {
      event.preventDefault();
      find(sectionLink.getAttribute(&quot;href&quot;)).scrollIntoView({ block: &quot;start&quot; });
      return;
    }
    const route = event.target.closest(&quot;[data-route]&quot;);
    if (route) {
      showPage(route.dataset.route);
      navigation.find((element) =&gt; element.dataset.route === route.dataset.route)?.focus();
      return;
    }
    const paperButton = event.target.closest(&quot;[data-open-paper]&quot;);
    if (paperButton) {
      const paper = papers.find((candidate) =&gt; candidate.key === paperButton.dataset.openPaper);
      if (paper) {
        state.selected_key = paper.key;
        state.selected_revision = paper.revision;
        renderReader();
        find(&quot;#px-reader-back&quot;).focus();
      }
      return;
    }
    if (event.target.closest(&quot;[data-clear-search]&quot;)) {
      state.query = &quot;&quot;; state.topic = &quot;&quot;; search.value = &quot;&quot;; topic.value = &quot;&quot;; filterPapers(); search.focus();
    }
  });
  find(&quot;.px-discovery&quot;).addEventListener(&quot;submit&quot;, (event) =&gt; { event.preventDefault(); filterPapers(); });
  search.addEventListener(&quot;input&quot;, () =&gt; { state.query = search.value; filterPapers(); });
  topic.addEventListener(&quot;change&quot;, () =&gt; { state.topic = topic.value; filterPapers(); });
  find(&quot;#px-reader-back&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    const route = selectedPaper().stage === &quot;draft&quot; ? &quot;drafts&quot; : &quot;papers&quot;;
    showPage(route);
    navigation.find((element) =&gt; element.dataset.route === route)?.focus();
  });
  revisionSelect.addEventListener(&quot;change&quot;, () =&gt; { state.selected_revision = Number(revisionSelect.value); renderReader(); });
  find(&quot;#px-dialog-close&quot;).addEventListener(&quot;click&quot;, () =&gt; { dialog.close(); });
  find(&quot;#px-citation-button&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    const paper = selectedPaper();
    openDialog(&quot;Cite this revision&quot;, &quot;Illustrative citation · Bound to the selected revision&quot;,
      paper.author + &quot;. &quot; + paper.title + &quot; prodxiv:&quot; + paper.paper_id + &quot;v&quot; + state.selected_revision + &quot;. &quot; + paperDate(paper) + &quot;. Written by Paperbot.\nhttps://prodxiv.example&quot; + paperPath(paper));
  });
  find(&quot;#px-draft-link-button&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    const paper = selectedPaper();
    openDialog(&quot;Link to this draft&quot;, &quot;Illustrative link · The draft URL identifies a mutable working paper.&quot;,
      &quot;https://prodxiv.example&quot; + paperPath(paper));
  });
  find(&quot;#px-source-button&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    const paper = selectedPaper();
    const source = [
      &quot;---&quot;, &#x27;schema_version: &quot;2&quot;&#x27;, &#x27;title: &quot;&#x27; + paper.title + &#x27;&quot;&#x27;,
      &#x27;product_name: &quot;&#x27; + paper.product_name + &#x27;&quot;&#x27;, &quot;version: &quot; + state.selected_revision,
      &#x27;license: &quot;CC BY 4.0&quot;&#x27;, &quot;---&quot;, &quot;&quot;, &quot;# Summary&quot;, &quot;&quot;, summaryText(paper),
      &quot;&quot;, &quot;# Background&quot;, &quot;&quot;, paper.background, &quot;&quot;, &quot;# Architecture&quot;, &quot;&quot;, paper.architecture,
      &quot;&quot;, &quot;# Limitations&quot;, &quot;&quot;, paper.limitations
    ].join(&quot;\n&quot;);
    openDialog(&quot;Source Markdown&quot;, &quot;Abbreviated example source · The live site will return the exact archived Markdown.&quot;, source);
  });
  filterPapers();
  renderList(find(&quot;#px-drafts-list&quot;), papers.filter((paper) =&gt; paper.stage === &quot;draft&quot;));
  showPage(&quot;papers&quot;);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
